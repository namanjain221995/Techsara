name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            set -e

            echo ">>> Pulling latest code..."
            cd /home/ec2-user/techsara
            git pull origin main

            echo ">>> Installing dependencies..."
            cd frontend
            npm install

            echo ">>> Building Next.js..."
            npm run build

            echo ">>> Restarting Frontend (PM2)..."
            pm2 restart techsara || pm2 start npm --name "techsara" -- start
            pm2 save

            echo ">>> Copying Nginx config..."
            sudo cp /home/ec2-user/techsara/nginx/techsara.conf /etc/nginx/conf.d/techsara.conf

            echo ">>> Testing Nginx config..."
            sudo nginx -t

            echo ">>> Reloading Nginx..."
            sudo systemctl reload nginx

            echo ">>> Deployment complete! Site is live at techsarasolutions.com"