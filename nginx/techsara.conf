# Canonical-host redirect (backup for the Cloudflare-level 301).
# Forces the bare apex (non-www) to https://www, preserving path + query string.
# TLS is terminated at Cloudflare, so the origin only needs the :80 listener here;
# any request that reaches the origin on the apex host is 301'd to the www host.
server {
    listen 80;
    server_name techsarasolutions.com;
    return 301 https://www.techsarasolutions.com$request_uri;
}

server {
    listen 80;
    server_name www.techsarasolutions.com;

    location / {
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade     $http_upgrade;
        proxy_set_header    Connection  'upgrade';
        proxy_set_header    Host        $host;
        proxy_set_header    X-Real-IP   $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript;
}